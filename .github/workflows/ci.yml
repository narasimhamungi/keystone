name: CI

on: [push, pull_request]

jobs:
  tests:
    name: Offline tests (pinned upstream tags, no EDGAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installs Trellis, ValuationLab, CreditRiskLab and Bridgework at the exact tags
      # pinned in pyproject.toml -- the same clean install that found CreditRiskLab's
      # packaged-config bug. Every test runs offline: the network is never touched.
      - run: pip install -e ".[dev]"
      - run: pytest -q
