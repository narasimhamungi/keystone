[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone"
version = "0.1.0"
description = "Equity-credit coherence check: cross-examines a company's credit read, DCF, trading comps and precedent transactions, with a cross-spine data tie-out and exact offline replay."
requires-python = ">=3.10"
# Every consumed repo is pinned to a tag (a locked scope decision): an upstream change can
# only reach a Keystone verdict through a deliberate re-pin, never by tracking main.
dependencies = [
    "trellis @ git+https://github.com/narasimhamungi/trellis.git@v0.2.0",
    "valuationlab @ git+https://github.com/narasimhamungi/valuationlab.git@v0.2.0",
    "creditrisklab @ git+https://github.com/narasimhamungi/CreditRiskLab.git@v0.2.1",
    "bridgework @ git+https://github.com/narasimhamungi/bridgework.git@v1.0.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
keystone = "keystone.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keystone = ["data/jnj_fixture/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
